<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judge-facing images</title>
<!--
  Gallery thumbnail, README hero, GitHub social preview and Open Graph image,
  drawn with the app's own tokens so they look like the same product.

  1. Copy this file to design/surfaces.html in the project.
  2. Point the three stylesheet links at the files the app loads, and paste
     the design's font <link> tags where marked.
  3. Replace Mid-Rip, Buy the pack mid-rip. and the screenshot path. The words come from the
     design brief; the screenshot is the real product at its result state,
     cropped to the product window:
     node shoot.mjs shot "<url>?state=result" design/shots/result-1440.png --selector "<product window>"
     The screenshot already carries the product's own window chrome, so the
     stage below adds none. If your screenshot is a bare app with no window,
     add class "framed" to each .s-stage to give it the design's window frame.
  4. Optional: set --surface-bg to a generated background image.
  5. Render with the screenshot script:
     node <path to shoot.mjs> surfaces design/surfaces.html design/out
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../app/src/styles/design/base.css">
<link rel="stylesheet" href="../app/src/styles/design/theme.css">
<link rel="stylesheet" href="../app/src/styles/design/components.css">
<style>
  body { padding: 40px; background: #777; display: grid; gap: 40px; justify-content: start; }
  [data-surface] {
    position: relative; overflow: hidden; isolation: isolate;
    background-color: var(--paper);
    background-image: var(--surface-bg, var(--bg-pattern));
    background-size: var(--surface-bg-size, var(--bg-size));
    background-position: center;
    color: var(--ink);
  }
  .s-name {
    font-family: var(--font-display); font-weight: var(--weight-display);
    letter-spacing: var(--track-display); text-transform: var(--display-case);
    line-height: 0.95; color: var(--ink); margin: 0;
  }
  .s-tag { font-family: var(--font-ui); color: var(--ink-2); line-height: 1.2; margin: 0; max-width: 18ch; }
  .s-shot { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .s-stage { position: absolute; overflow: hidden; }
  .s-stage.framed { background: var(--sheet); border: var(--border-w) solid var(--frame-line); border-radius: var(--r-window); box-shadow: var(--shadow-window); }

  /* Gallery thumbnail, 3:2. Name stays readable at 320 px wide. */
  .thumb { width: 1500px; height: 1000px; }
  .thumb .s-copy { position: absolute; left: 72px; top: 64px; right: 72px; display: flex; align-items: baseline; justify-content: space-between; gap: 40px; }
  .thumb .s-name { font-size: 112px; }
  .thumb .s-tag { font-size: 40px; text-align: right; }
  .thumb .s-stage { left: 72px; right: 72px; top: 230px; bottom: -40px; }

  /* README hero and social previews, 2:1. Words left, product right. */
  .wide .s-copy { position: absolute; display: grid; gap: 28px; align-content: center; }
  .wide .s-stage { top: 12%; bottom: -8%; }
  .hero { width: 1600px; height: 800px; }
  .hero .s-copy { left: 80px; top: 0; bottom: 0; width: 520px; }
  .hero .s-name { font-size: 104px; }
  .hero .s-tag { font-size: 40px; }
  .hero .s-stage { left: 660px; right: -60px; }
  .social { width: 1280px; height: 640px; }
  .social .s-copy { left: 64px; top: 0; bottom: 0; width: 440px; }
  .social .s-name { font-size: 88px; }
  .social .s-tag { font-size: 34px; }
  .social .s-stage { left: 540px; right: -50px; }
  .og { width: 1200px; height: 630px; }
  .og .s-copy { left: 60px; top: 0; bottom: 0; width: 410px; }
  .og .s-name { font-size: 84px; }
  .og .s-tag { font-size: 32px; }
  .og .s-stage { left: 500px; right: -50px; }
  [data-surface] { background-color: var(--band); }
  .s-name { letter-spacing: -0.045em; }
  .s-tag { color: #000; letter-spacing: -0.02em; }
  .px { position: absolute; z-index: -1; }
  .px.g { background: var(--g); } .px.p { background: var(--p); } .px.y { background: var(--y); } .px.c { background: var(--c); }
  .px.d { background-image: radial-gradient(rgb(0 0 0 / 0.35) 1px, transparent 1.4px); background-size: 25px 25px; }
</style>
</head>
<body>

<section data-surface="thumbnail" class="thumb">
  <i class="px p" style="left:0;top:0;width:50px;height:50px"></i><i class="px g d" style="left:50px;top:50px;width:100px;height:100px"></i><i class="px y d" style="right:0;bottom:120px;width:60px;height:100px"></i><i class="px c" style="right:60px;bottom:220px;width:100px;height:50px"></i>
  <div class="s-copy">
    <h1 class="s-name">Mid-Rip</h1>
    <p class="s-tag">Buy the pack mid-rip.</p>
  </div>
  <div class="s-stage"><img class="s-shot" src="shots/result-1440.png" alt="A live Mid-Rip table: the sealed rest of a pack on a falling price clock, two cards revealed and four sealed"></div>
</section>

<section data-surface="readme-hero" class="wide hero">
  <i class="px p" style="left:0;top:0;width:50px;height:50px"></i><i class="px g d" style="left:50px;top:50px;width:100px;height:100px"></i><i class="px y d" style="right:0;bottom:120px;width:60px;height:100px"></i><i class="px c" style="right:60px;bottom:220px;width:100px;height:50px"></i>
  <div class="s-copy">
    <h1 class="s-name">Mid-Rip</h1>
    <p class="s-tag">Buy the pack mid-rip.</p>
  </div>
  <div class="s-stage"><img class="s-shot" src="shots/result-1440.png" alt="A live Mid-Rip table: the sealed rest of a pack on a falling price clock, two cards revealed and four sealed"></div>
</section>

<section data-surface="social-github" class="wide social">
  <i class="px p" style="left:0;top:0;width:50px;height:50px"></i><i class="px g d" style="left:50px;top:50px;width:100px;height:100px"></i><i class="px y d" style="right:0;bottom:120px;width:60px;height:100px"></i><i class="px c" style="right:60px;bottom:220px;width:100px;height:50px"></i>
  <div class="s-copy">
    <h1 class="s-name">Mid-Rip</h1>
    <p class="s-tag">Buy the pack mid-rip.</p>
  </div>
  <div class="s-stage"><img class="s-shot" src="shots/result-1440.png" alt="A live Mid-Rip table: the sealed rest of a pack on a falling price clock, two cards revealed and four sealed"></div>
</section>

<section data-surface="social-og" class="wide og">
  <i class="px p" style="left:0;top:0;width:50px;height:50px"></i><i class="px g d" style="left:50px;top:50px;width:100px;height:100px"></i><i class="px y d" style="right:0;bottom:120px;width:60px;height:100px"></i><i class="px c" style="right:60px;bottom:220px;width:100px;height:50px"></i>
  <div class="s-copy">
    <h1 class="s-name">Mid-Rip</h1>
    <p class="s-tag">Buy the pack mid-rip.</p>
  </div>
  <div class="s-stage"><img class="s-shot" src="shots/result-1440.png" alt="A live Mid-Rip table: the sealed rest of a pack on a falling price clock, two cards revealed and four sealed"></div>
</section>

</body>
</html>
